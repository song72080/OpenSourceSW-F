<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="출신별 전국지도로 소개하는 Fork 팀 포트폴리오">
  <title>Fork | 홈</title>
  <link rel="stylesheet" href="css/style.css">
    <style>
    body { background: #0b0b0b; color: #f2f2f2; }
    .home-wrap { width: min(1000px, 92%); margin: 0 auto; text-align: center; }

    .home-hero { padding: 88px 0 72px; border-bottom: 1px solid #1f1f1f; }
    .home-logo { display: block; width: min(380px, 78%); height: auto; margin: 0 auto 20px; }
    .home-eyebrow { color: #8c8c8c; font-size: .8rem; font-weight: 700; letter-spacing: .18em; }
    .home-hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.25; margin: 14px 0; color: #fff; }
    .home-hero p { color: #b5b5b5; max-width: 560px; margin: 0 auto; }
    .home-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .home-btn { display: inline-block; padding: 11px 22px; border-radius: 999px; font-weight: 700; border: 1px solid #fff; background: #fff; color: #0b0b0b; }
    .home-btn.line { background: transparent; color: #fff; border-color: #555; }
    .home-btn:hover { opacity: .85; }

    @media (max-width: 760px) {
      .home-hero { padding: 60px 0 52px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">본문으로 이동</a>

  <header class="site-header" data-header></header>

  <main id="content">
    <section class="home-hero">
      <div class="home-wrap">
        <img class="home-logo" src="images/logo.png" alt="Fork 로고">

        <h1>다른 출발점에서<br>하나의 결과물로, Fork</h1>
        <p>서로 다른 지역에서 모인 6명이 Git과 GitHub로 협업해 만든 팀 포트폴리오입니다.</p>
        <div class="home-actions">
          <a class="home-btn" href="members.html">팀원 만나보기</a>
          <a class="home-btn line" href="about.html">Fork 알아보기</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="js/main.js" defer></script>
</body>
